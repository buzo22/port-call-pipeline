version: 2

models:
  - name: int_vessels
    description: One row per vessel with its most common reported attributes.
    columns:
      - name: mmsi
        data_tests: [unique, not_null]

  - name: int_port_positions
    description: Cargo and tanker positions inside a port radius.
    columns:
      - name: port_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('ports')
                field: port_code
